apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-gateway-options
  namespace: openshift-ingress
data:
  deployment: |
    spec:
      template:
        spec:
          containers:
          - name: istio-proxy
            resources:
              requests:
                cpu: "1500m"
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 2Gi
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 1
      maxReplicas: 2
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 300
          policies:
          - type: Pods
            value: 1
            periodSeconds: 300
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
          - type: Pods
            value: 1
            periodSeconds: 60
