apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: qwen-free
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Qwen Free Tier"
    openshift.io/description: "Free tier: 500 tokens/min for all authenticated users"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: qwen25-05b-instruct
      namespace: llm
      tokenRateLimits:
        - limit: 500
          window: 1m
  priority: 10
